---
name: Crowdin Upload

on:
  push:
    branches: [main]
    # Only what reaches a mapped crowdin.yml source: docs/ itself, and the UI
    # strings `write-translations` extracts into i18n/en/ from code, theme
    # config, sidebars, category files and the Docusaurus version. Page bodies
    # under community/ and ecosystem/ are not mapped, so only their category
    # files trigger. A category labelled by its index doc or directory name
    # (no category file) is sent on the next run; every run regenerates
    # everything.
    paths:
      - "docs/**"
      - "community/**/_category_.*"
      - "ecosystem/**/_category_.*"
      - "src/**"
      - "docusaurus.config.ts"
      - "sidebars.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "crowdin.yml"
      - ".github/workflows/crowdin-upload.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: Crowdin
    timeout-minutes: 10
    steps:
      - name: "⤵️ Check out code from GitHub"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "📦 Setup pnpm"
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true
      # The committed i18n/en/ files are not kept current by hand. Regenerate
      # them from scratch so new labels and strings are sent and removed ones
      # are not (write-translations only appends to an existing file).
      - name: "🔄 Regenerate English source strings"
        run: |
          rm -rf i18n/en
          pnpm write-translations --locale en
      # Secrets reach only this step: the steps above run dependency install
      # scripts and the site's config and plugins. An upload-only run needs no
      # GitHub token (the action reads one only to push or open a pull request).
      - name: "🚀 Crowdin Upload"
        uses: crowdin/github-action@e4a6c1338b4063c77d46a81875265f9e8bd76f95 # v3.0.0
        env:
          CROWDIN_PROJECT: ${{ secrets.CROWDIN_PROJECT }}
          CROWDIN_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          upload_sources_args: "--delete-obsolete"
