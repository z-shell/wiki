---
name: Zsh Plugin Standard Review

on:
  schedule:
    # 07:23 UTC on January 17 and July 17.
    - cron: "23 7 17 1,7 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  review:
    name: Validate and open review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zsh
      - name: Validate deterministic contract
        run: pnpm validate:plugin-standard
      - name: Open ecosystem relevance review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/open-plugin-standard-review.mjs
