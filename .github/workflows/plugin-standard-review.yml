---
name: Zsh Plugin Standard Review

on:
  schedule:
    # 07:23 UTC on January 17 and July 17.
    - cron: "23 7 17 1,7 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  review:
    name: Validate and open review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate deterministic contract
        run: pnpm validate:plugin-standard
      - name: Open ecosystem relevance review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/open-plugin-standard-review.mjs
