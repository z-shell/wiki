---
name: Zsh Plugin Standard Review

on:
  schedule:
    # 07:23 UTC on January 17 and July 17.
    - cron: "23 7 17 1,7 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  review:
    name: Validate and open review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true
      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zsh
      - name: Validate deterministic contract
        run: pnpm validate:plugin-standard
      - name: Open ecosystem relevance review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/open-plugin-standard-review.mjs
