onlyBuiltDependencies:
  - "@swc/core"
  - core-js
  - core-js-pure
  - sharp
  - unrs-resolver

# Packages that are always optional but never useful in this environment
ignoredOptionalDependencies:
  - fsevents

# Dependency version overrides (replaces pnpm.overrides in package.json)
overrides:
  "@babel/core": "7.29.7"
  "asciinema-player>solid-js": "1.9.14"
  "brace-expansion@<2.0.0": "1.1.18"
  "brace-expansion@>=5.0.0 <6.0.0": "5.0.9"
  "eslint>jiti": "^2.6.1"
  fast-uri: "3.1.5"
  js-yaml: "4.3.1"
  nanoid: "3.3.18"
  postcss: "8.5.23"
  webpackbar: "^7.0.0"
  serialize-javascript: "7.0.5"
  uuid: "14.0.0"

# Allow ESLint 10 (current stable) for plugins whose declared peer range
# predates it but which work fine with it. Removes install-time peer warnings.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-jsx-a11y>eslint": "^10"
